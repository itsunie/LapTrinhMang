{{ define "main" }}
<section class="home-wrap">

  <div class="home-hero-grid">

    <!-- LEFT: text card -->
    <section class="card home-hero-text">
      <h1 class="home-title">
        I may move slowly, but I’m still moving forward.
      </h1>

    </section>

    <!-- RIGHT: image card -->
    <section class="card home-hero-photo">
      <img class="home-portrait" src='{{ "img/profile.jpg" | relURL }}' alt="Portrait" loading="eager" />
    </section>

  </div>

</section>
{{ end }}
