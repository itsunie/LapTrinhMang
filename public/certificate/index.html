        <span class="music-bars" aria-hidden="true">

      <audio id="bgMusic" preload="none" loop>
        <source src='/LapTrinhMang/audio/bg.mp3' type="audio/mpeg" />
      </audio>
      <button id="themeToggle" class="btn theme-toggle" type="button" aria-label="Toggle theme">
        <span class="theme-ico">🌓</span>
      </button>
    </div>

  <script>
    (function () {
      const audio = document.getElementById("bgMusic");
      const btn = document.getElementById("musicToggle");
      const label = document.getElementById("musicLabel");

      function setUI(isPlaying) {
        btn.classList.toggle("is-playing", isPlaying);
        btn.setAttribute("aria-label", isPlaying ? "Pause music" : "Play music");
        label.textContent = isPlaying ? "Playing" : "Music";
      }

      const saved = localStorage.getItem("music:on") === "1";
      setUI(false);

      if (saved) {
        audio.volume = 0.6;
        audio.play().then(() => setUI(true)).catch(() => setUI(false));
      }

      btn.addEventListener("click", async () => {
        if (audio.paused) {
          audio.volume = 0.6;
          try {
            await audio.play();
            localStorage.setItem("music:on", "1");
            setUI(true);
          } catch (e) {
            setUI(false);
          }
        } else {
          audio.pause();
          localStorage.setItem("music:on", "0");
          setUI(false);
        }
      });
    })();

  </script>

  <div class="cert-fs" id="certFs" aria-hidden="true">
    <div class="cert-fs__backdrop" data-close="1"></div>

    <div class="cert-fs__panel" role="dialog" aria-modal="true" aria-label="Certificate fullscreen viewer">
      <button class="cert-fs__close" type="button" aria-label="Close" data-close="1">×</button>
      <img class="cert-fs__img" id="certFsImg" alt="" />
    </div>
  </div>

  <script>
    (function () {
      const fs = document.getElementById('certFs');
      const fsImg = document.getElementById('certFsImg');

      
      if (fs && fs.parentElement !== document.body) document.body.appendChild(fs);

      const openButtons = document.querySelectorAll('.cert-open');
      let lastFocus = null;

      function openFs(src, alt) {
        if (!fs || !fsImg) return;
        lastFocus = document.activeElement;

        fsImg.src = src;
        fsImg.alt = alt || 'Certificate';

        fs.classList.add('is-open');
        fs.setAttribute('aria-hidden', 'false');
        document.documentElement.classList.add('cert-fs-open');

        const closeBtn = fs.querySelector('.cert-fs__close');
        if (closeBtn) closeBtn.focus();
      }

      function closeFs() {
        if (!fs || !fsImg) return;

        fs.classList.remove('is-open');
        fs.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('cert-fs-open');

        fsImg.removeAttribute('src');
        fsImg.alt = '';

        if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
      }

      openButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.cert-card');
          if (!card) return;
          const src = card.getAttribute('data-image');
          const img = card.querySelector('img');
          if (!src) return;
          openFs(src, img ? img.getAttribute('alt') : '');
        });
      });

      
      if (fs) {
        fs.addEventListener('click', (e) => {
          const t = e.target;
          if (t && t.getAttribute && t.getAttribute('data-close') === '1') closeFs();
        });
      }

      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && fs && fs.classList.contains('is-open')) closeFs();
      });
    })();
  </script>

  <script>
(function () {
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");
  if (!btn) return;

  const KEY = "theme";

  function apply(t){
    root.setAttribute("data-theme", t);
    try{ localStorage.setItem(KEY, t); }catch(e){}
  }

  const saved = (()=>{ try{return localStorage.getItem(KEY);}catch(e){return null;} })();
  const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  apply(saved || system);

  btn.addEventListener("click", ()=>{
    const cur = root.getAttribute("data-theme") || "light";
    apply(cur === "dark" ? "light" : "dark");
  });
})();
</script>
